<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spese</title>
  <meta name="description" content="Tieni traccia di quanto spendi e in cosa.">
  <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E12" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spese">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Sezioni">
      <button class="tab" data-tab="month" aria-label="Mese"></button>
      <button class="tab" data-tab="trend" aria-label="Andamento"></button>
      <button class="fab" data-action="add" aria-label="Aggiungi spesa"></button>
      <button class="tab" data-tab="recurring" aria-label="Ricorrenti"></button>
      <button class="tab" data-tab="settings" aria-label="Impostazioni"></button>
    </nav>
  </div>
  <div id="layer"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Per usare Spese serve JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
